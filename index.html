<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DACE">
<title>DACE Arecibo - Oficial</title>
<style>
  :root {
    --bg-light: #F8FAFC;
    --text-main: #1D1D1F;
    --police-blue: #0A192F;
    --police-gold: #C5A059;
    --text-white: #FFFFFF;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-light); margin: 0; padding: 0; color: var(--text-main); -webkit-user-select: none; }
  
  /* Cabecera Transparente con Logos Laterales y Texto Centrado */
  .app-header {
    background: transparent; /* Fondo Transparente solicitado */
    padding: 60px 20px 25px; /* Espacio para el Notch del iPhone */
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    justify-items: center;
    border-bottom: 2px solid rgba(0,0,0,0.1); /* Línea divisoria sutil */
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .header-logo {
    height: 60px; /* Tamaño de los logos solicitado */
    width: auto;
  }
  .header-center-text {
    text-align: center;
    color: var(--police-blue);
  }
  .header-center-text h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .header-center-text p.institucion { margin: 4px 0 2px; font-size: 13px; font-weight: 500; }
  .header-center-text p.oficial { margin: 2px 0 0; font-size: 11px; font-weight: 400; opacity: 0.9; }

  /* Contenedor de Tarjetas de Estadísticas */
  .summary-section {
    padding: 20px;
    background: white;
    border-bottom: 1px solid #E5E7EB;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .stat-card {
    background: #F9FAFB;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #F3F4F6;
  }
  .stat-card h2 { margin: 0; font-size: 34px; font-weight: 800; color: var(--police-blue); }
  .stat-card p { margin: 5px 0 0; font-size: 11px; color: #6B7280; font-weight: 700; text-transform: uppercase; }

  /* Botón de Acción Principal Oficial */
  .action-container {
    padding: 0 20px;
    margin-top: 25px;
    margin-bottom: 100px;
  }
  .btn-primary {
    width: 100%;
    padding: 18px;
    background: var(--police-blue);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(10,25,47,0.2);
    cursor: pointer;
  }

  /* Menú de Navegación Inferior Estilo iOS Nivel 17 */
  .nav-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(15px);
    display: flex;
    justify-content: space-around;
    padding: 12px 0 28px; /* Espacio para el Home Indicator del iPhone */
    border-top: 1px solid #E5E7EB;
    z-index: 1000;
  }
  .nav-item {
    text-align: center;
    color: #9CA3AF;
    text-decoration: none;
    font-size: 10px;
    font-weight: 600;
    flex: 1;
  }
  .nav-item.active {
    color: var(--police-blue);
  }
  .nav-icon {
    font-size: 24px;
    display: block;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

    <div class="header-center-text">
      <h1>DACE ARECIBO</h1>

</html>
