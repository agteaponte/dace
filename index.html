<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>DACE - RECUPERACIÓN OFICIAL</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --blue: #3b82f6; --gold: #f59e0b; --purple: #8b5cf6; --green: #10b981; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; padding: 0; }
        .header { padding: 50px 15px 20px; text-align: center; border-bottom: 1px solid #1e293b; }
        .header h1 { font-size: 16px; margin: 0; letter-spacing: 1px; }
        .header p { font-size: 11px; margin: 5px 0; color: var(--gold); font-weight: 800; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { background: var(--card); padding: 22px; border-radius: 18px; border-bottom: 4px solid var(--blue); }
        .card h2 { font-size: 36px; margin: 0; font-weight: 900; }
        .card p { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-top: 5px; font-weight: 700; }

        .feed { padding: 0 15px 120px; }
        .item { background: var(--card); border-radius: 15px; padding: 18px; margin-bottom: 12px; border-left: 5px solid var(--blue); }
        .item b { display: block; color: #fff; margin-bottom: 5px; font-size: 15px; }
        .item p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.4; }
        .item small { font-size: 10px; color: #475569; margin-top: 8px; display: block; font-weight: bold; }

        .nav { position: fixed; bottom: 0; width: 100%; background: #1e293b; display: flex; padding: 12px 0 35px; border-top: 1px solid #334155; }
        .nav-btn { flex: 1; text-align: center; color: white; font-size: 10px; font-weight: 800; background: none; border: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>POLICÍA DE PUERTO RICO</h1>
        <p>Agte. Jose Aponte 31093 - AREA ARECIBO</p>
        <div style="font-size: 9px; color: #3b82f6;">✓ MODO DE RECUPERACIÓN ACTIVO</div>
    </div>

    <div class="grid">
        <div class="card" style="border-color: var(--blue)"><i>⚖️</i><h2 id="q">0</h2><p>Querellas activas</p></div>
        <div class="card" style="border-color: var(--gold)"><i>🏗️</i><h2 id="i">0</h2><p>Inspecciones pend.</p></div>
        <div class="card" style="border-color: var(--purple)"><i>📁</i><h2 id="t">0</h2><p>Casos abiertos</p></div>
        <div class="card" style="border-color: var(--green)"><i>✏️</i><h2 id="n">0</h2><p>Notas guardadas</p></div>
    </div>

    <div style="font-size: 11px; font-weight: 800; color: #475569; margin: 15px; text-transform: uppercase;">Actividad Detectada en iPhone:</div>
    <div class="feed" id="feed"></div>

    <nav class="nav">
        <button class="nav-btn" onclick="location.reload()">🔄 REFRESCAR Y BUSCAR DATA</button>
    </nav>

<script>
    // Conexión a su Nube
    const firebaseConfig = {
        apiKey: "AIzaSyAkjIRWdtpb3FKelk7rhKKPgzf5HgK90pc",
        authDomain: "dace-arecibo-oficial.firebaseapp.com",
        projectId: "dace-arecibo-oficial",
        storageBucket: "dace-arecibo-oficial.firebasestorage.app",
        messagingSenderId: "1061384536706",
        appId: "1:1061384536706:web:0df609d6159739af58aa9b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function escanearYMostrar() {
        const feed = document.getElementById('feed');
        let totalEncontrado = 0;
        feed.innerHTML = "";

        // ESCÁNER AGRESIVO: Revisa todas las gavetas de memoria del iPhone
        for (let i = 0; i < localStorage.length; i++) {
            let llave = localStorage.key(i);
            try {
                let datos = JSON.parse(localStorage.getItem(llave));
                if (Array.isArray(datos)) {
                    datos.forEach(dato => {
                        totalEncontrado++;
                        // Mostrar en pantalla inmediatamente
                        feed.innerHTML += `
                            <div class="item">
                                <b>${dato.numero || dato.titulo || "REGISTRO"}</b>
                                <p>${dato.descripcion || dato.nota || dato.detalle || "Sin descripción"}</p>
                                <small>${dato.fecha || "Fecha no grabada"} • UBICACIÓN: ${llave.toUpperCase()}</small>
                            </div>`;
                        
                        // SUBIR A FIREBASE PARA QUE SE VEA EN LA PC
                        db.collection("recuperacion_total").add({
                            titulo: dato.numero || dato.titulo || "REGISTRO",
                            detalle: dato.descripcion || dato.nota || "Sin descripción",
                            fecha: dato.fecha || new Date().toLocaleString(),
                            original_llave: llave
                        });
                    });
                }
            } catch(e) { console.log("Saltando llave no válida"); }
        }

        document.getElementById('q').innerText = totalEncontrado;
        document.getElementById('t').innerText = totalEncontrado;
        document.getElementById('n').innerText = totalEncontrado;

        if(totalEncontrado === 0) {
            feed.innerHTML = "<p style='text-align:center; color:red;'>⚠️ NO SE DETECTÓ DATA EN ESTA MEMORIA. ABRA EL ENLACE DESDE EL IPHONE DONDE ESCRIBIÓ LAS NOTAS.</p>";
        }
    }

    escanearYMostrar();
</script>
</body>
</html>
