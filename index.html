<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DACE Arecibo Oficial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root { --p-blue: #0a192f; --p-gold: #c5a059; --bg: #f8fafc; }
  * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); margin: 0; padding: 0; color: #1d1d1f; overflow-x: hidden; }
  
  /* Cabecera Transparente con Logos Solicitada */
  .app-header {
    display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center;
    padding: 55px 10px 20px; background: transparent; border-bottom: 1.5px solid rgba(10,25,47,0.1);
  }
  .header-logo { height: 55px; width: auto; object-fit: contain; }
  .header-text { text-align: center; }
  .header-text h1 { margin: 0; font-size: 19px; color: var(--p-blue); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .header-text p { margin: 2px 0; font-size: 11px; line-height: 1.2; font-weight: 500; }
  .oficial-info { color: #64748b; font-size: 9px !important; margin-top: 4px !important; }

  /* Menú de Navegación Nivel iPhone */
  .nav-bar {
    position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.94); backdrop-filter: blur(15px);
    display: flex; padding: 12px 0 32px; border-top: 1px solid #e2e8f0; z-index: 1000;
  }
  .nav-item { flex: 1; text-align: center; border: none; background: none; color: #94a3b8; font-size: 10px; font-weight: 700; }
  .nav-item.active { color: var(--p-blue); }
  .nav-icon { display: block; font-size: 24px; margin-bottom: 4px; }

  /* Contenedor de Contenido */
  .main-content { padding: 20px 15px 120px; }
  .card { background: white; padding: 22px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 6px solid var(--p-blue); }
  .card h2 { margin: 0; font-size: 38px; color: var(--p-blue); font-weight: 900; }
  .card p { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
  .btn-action { width: 100%; padding: 18px; background: var(--p-blue); color: white; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; box-shadow: 0 4px 12px rgba(10,25,47,0.2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;

function App() {
  const [tab, setTab] = useState('inicio');
  const [data, setData] = useState({ q: [], i: [], c: [], n: [] });

  // Carga de datos local (Persistencia)
  useEffect(() => {
    const saved = localStorage.getItem('dace_v5');
    if (saved) { try { setData(JSON.parse(saved).data); } catch(e) {} }
  }, []);

  const renderContent = () => {
    switch(tab) {
      case 'inicio': return React.createElement('div', null,
        React.createElement('div', { className: 'card' }, 
          React.createElement('h2', null, data.q.length), React.createElement('p', null, 'Querellas Activas (137.1)')
        ),
        React.createElement('div', { className: 'card' }, 
          React.createElement('h2', null, data.i.length), React.createElement('p', null, 'Inspecciones Pendientes (137.3)')
        ),
        React.createElement('button', { className: 'btn-action' }, '+ NUEVA ACTIVIDAD DACE')
      );
      case '137.1': return React.createElement('div', null, React.createElement('h3', null, 'Módulo PPR-137.1'));
      case '137.3': return React.createElement('div', null, React.createElement('h3', null, 'Módulo PPR-137.3'));
      case 'config': return React.createElement('div', null, React.createElement('h3', null, 'Configuración y Respaldos'));
      default: return null;
    }
  };

  return React.createElement('div', null,
    // CABECERA OFICIAL CON LOGOS SOLICITADA
    React.createElement('div', { className: 'app-header' },
      React.createElement('img', { src: 'Logo_DACE_Arecibo_12x12_Final.jpg', className: 'header-logo', onError: (e) => e.target.style.display='none' }),
      React.createElement('div', { className: 'header-text' },
        React.createElement('h1', null, 'DACE ARECIBO'),
        React.createElement('p', null, 'Negociado de la Policía de Puerto Rico'),
        React.createElement('p', { className: 'oficial-info' }, 'Agte. Jose Aponte Cancel 31093 / Coordinador Auxiliar DACE Arecibo')
      ),
      React.createElement('img', { src: 'Policia.png', className: 'header-logo', onError: (e) => e.target.style.display='none' })
    ),

    // ÁREA DE TRABAJO
    React.createElement('div', { className: 'main-content' }, renderContent()),

    // NAVEGACIÓN INFERIOR FUNCIONAL
    React.createElement('nav', { className: 'nav-bar' },
      [['inicio', '📊', 'PANEL'], ['137.1', '⚖️', '137.1'], ['137.3', '🏗️', '137.3'], ['config', '⚙️', 'CONFIG']].map(([id, icon, label]) => 
        React.createElement('button', {
          key: id,
          className: `nav-item ${tab === id ? 'active' : ''}`,
          onClick: () => setTab(id)
        }, React.createElement('span', { className: 'nav-icon' }, icon), label)
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
